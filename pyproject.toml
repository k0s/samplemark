[project]
name = "samplemark"
version = "0.1.0"
description = "Mark and save audio samples from a Linux machine's audio output"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.119",
    "jinja2>=3.1",
]

[project.scripts]
samplemark = "samplemark.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samplemark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
